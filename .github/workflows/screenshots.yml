name: Screenshots

# Generates the App Store screenshots and, with "upload" ticked, replaces the
# App Store version's screenshots with them once approved. Download the
# screenshots artifact from the run to check them before approving.
#
# Run it on the branch of the version whose screenshots should change (the
# version in Base.xcconfig), e.g. release/<version>.
#
# Generating needs no secrets: the UI tests build Debug against stubbed data.
# Only the upload job gets the App Store Connect key.
#
# Each device generates on its own runner: a standard runner (3 cores, 7 GB)
# froze when it started a second simulator (seen in tube-service). Each runner
# also takes only 2 languages: memory runs low as a runner goes through
# languages, and with all 6 an iPad run swapped until its 4th language's app
# failed to launch. Only about 5 macOS jobs run at once, so one of the 6 waits,
# but each builds once and takes 2 languages, so the run takes about as long.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (after approval)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: xcode-27
    strategy:
      # Lets the other jobs finish, so one run shows how they're all doing
      fail-fast: false
      matrix:
        # The Snapfile's devices
        device:
          - iPhone 18 Pro Max
          - iPad Pro 13-inch (M5)
        # The Snapfile's languages, 2 to a runner
        language-group:
          - { name: en, languages: 'en-GB,en-US' }
          - { name: es, languages: 'es-ES,es-MX' }
          - { name: fr, languages: 'fr-CA,fr-FR' }
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - name: Confirm Xcode version
        run: xcodebuild -version
      - name: Install gems
        run: bundle install
      - name: Generate screenshots
        # Fails a hung run long before GitHub's 6 hours. On the step rather than
        # the job, so the logs still upload: a job timeout cancels the job, and
        # failure() steps don't run. Sized for 1 device in 2 languages: one full
        # build, then the other language re-localizes the simulator and rebuilds
        # incrementally (on CI with 6 languages, the iPad took 13 minutes for
        # the first and 5 for each other)
        timeout-minutes: 30
        env:
          DEVICE: ${{ matrix.device }}
          LANGUAGES: ${{ matrix.language-group.languages }}
        # Prints memory use every 30 seconds among snapshot's output, so if the
        # runner freezes, the live log shows whether it ran out of memory first
        run: |
          while true; do
            echo "[memory] $(date -u +%H:%M:%S) $(memory_pressure | tail -1), swap $(sysctl -n vm.swapusage)"
            sleep 30
          done &
          trap "kill $!" EXIT
          bundle exec fastlane screenshots output_directory:"$RUNNER_TEMP/screenshots" device:"$DEVICE" languages:"$LANGUAGES"
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.device }}-${{ matrix.language-group.name }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
      # snapshot deletes its derived data, result bundle included, so its
      # xcodebuild logs are what's left to debug a failure with
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-logs-${{ matrix.device }}-${{ matrix.language-group.name }}
          path: ~/Library/Logs/snapshot

  # Manual approval job
  upload:
    if: inputs.upload
    runs-on: xcode-27
    needs: generate
    environment:
      name: app-store
    env:
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          # Every job's, into one folder
          pattern: screenshots-*
          merge-multiple: true
          path: ${{ runner.temp }}/screenshots
      - name: Install gems
        run: bundle install
      - name: Upload screenshots
        timeout-minutes: 60
        run: bundle exec fastlane upload_screenshots screenshots_path:"$RUNNER_TEMP/screenshots"
