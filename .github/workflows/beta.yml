name: Beta

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow this workflow to be triggered manually      


env:
  XCODE_CONFIG: Beta
  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
  MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-deploy-beta:
    runs-on: xcode-27
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Confirm Xcode version
        run: xcodebuild -version
      # Boot the unit test simulator early so it starts up while dependencies,
      # signing and the build run, rather than after them inside scan
      - name: Install gems and pre-boot simulator
        run: |
          bundle install
          bundle update fastlane
          bundle exec fastlane boot_test_simulator
      - name: Install dependencies
        run: |
          brew untap aws/tap || true        
          brew install librsvg
          brew install imagemagick
      - name: Swift format lint
        run: Scripts/swift-format-lint.sh
      - name: Fastlane commands
        run: |
          bundle exec fastlane sync_signing
          bundle exec fastlane unit_tests
          bundle exec fastlane add_badge_overlay
          bundle exec fastlane build
          bundle exec fastlane distribute
